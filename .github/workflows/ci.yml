name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Three jobs run side by side: the checks, the debug APK with lint, and on a pull request the signed release APK,
# so a green pull request already carries the APK its squash merge would build. The Go library (gomobile bind)
# comes from the Gradle build cache that main writes, unless the pull request changed Go code.
jobs:
  checks:
    name: Lint, tests, module graph, all flavors
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the app's version is the commit count

      - uses: ./.github/actions/setup-build
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      # On a pull request, HEAD^1 is the base branch, so this asks whether the pull request touched the Go code.
      - name: Go tests
        working-directory: network/gonet/go
        run: |
          if [ "${{ github.event_name }}" = pull_request ] && git diff --quiet HEAD^1 HEAD -- .; then
            echo "No Go changes; skipped"
            exit 0
          fi
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...

      - name: Module graph rules
        run: ./gradlew checkModuleGraph

      - name: Build logic tests
        run: ./gradlew -p build-logic :convention:test

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew test 2>&1 | tee unit-tests.log

      - name: Surface unit test failures
        if: failure()
        run: |
          grep -E '^e: |FAILED|What went wrong|Exception' unit-tests.log | head -40 | while IFS= read -r line; do
            echo "::error title=Unit tests::${line//$'\r'/}"
          done
          find . -path '*/build/test-results/*' -name '*.xml' -print0 | while IFS= read -r -d '' f; do
            grep -o '<failure[^>]*>' "$f" | head -3 | sed "s|^|$f: |" | while IFS= read -r line; do echo "::error title=Failed test::$line"; done
          done

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-reports
          path: |
            **/build/reports/
            **/build/test-results/

  android:
    name: Android lint and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the app's version is the commit count

      - uses: ./.github/actions/setup-build
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Android lint
        run: ./gradlew :app:lintDebug

      - name: Assemble the debug APK
        run: ./gradlew :app:assembleDebug

      - name: Upload the debug APK for on-device checks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pocketpilot-oss-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-reports
          path: "**/build/reports/"

  # The signed release APK of a pull request from this repository, versioned as its merge will be, so it can be
  # installed the moment the pull request merges. Pull requests from forks get no secrets, so they skip it.
  release:
    name: Signed release APK
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the app's version is the commit count

      - uses: ./.github/actions/setup-build

      # The release key comes from repository secrets, decoded into the runner's temporary folder and never into the
      # repository. Without the secrets this step fails, so an unsigned APK is never uploaded.
      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::RELEASE_KEYSTORE_BASE64 is not set"; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Assemble the release APK
        env:
          POCKETPILOT_RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          POCKETPILOT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          POCKETPILOT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          POCKETPILOT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Remove the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload the release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pocketpilot-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
