name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, tests, module graph, all flavors
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      # network/gonet builds its Go networking library with gomobile and the runner's Android NDK.
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: network/gonet/go/go.mod
          cache-dependency-path: network/gonet/go/go.sum

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - name: Go tests
        working-directory: network/gonet/go
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
          go vet ./...
          go test ./...

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Module graph rules
        run: ./gradlew checkModuleGraph

      - name: Build logic tests
        run: ./gradlew -p build-logic :convention:test

      - name: ktlint
        run: ./gradlew ktlintCheck

      - name: Unit tests
        run: |
          set -o pipefail
          ./gradlew test 2>&1 | tee unit-tests.log

      - name: Surface unit test failures
        if: failure()
        run: |
          grep -E '^e: |FAILED|What went wrong|Exception' unit-tests.log | head -40 | while IFS= read -r line; do
            echo "::error title=Unit tests::${line//$'\r'/}"
          done
          find . -path '*/build/test-results/*' -name '*.xml' -print0 | while IFS= read -r -d '' f; do
            grep -o '<failure[^>]*>' "$f" | head -3 | sed "s|^|$f: |" | while IFS= read -r line; do echo "::error title=Failed test::$line"; done
          done

      - name: Android lint
        run: ./gradlew :app:lintOssDebug

      - name: Assemble every flavor
        run: ./gradlew :app:assembleDebug

      - name: Upload the oss debug APK for on-device checks
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pocketpilot-oss-debug
          path: app/build/outputs/apk/oss/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload lint and test reports
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
