name: Release build

# Builds the release APK, with R8 shrinking and minification, and uploads it. Run it by hand to check the release build
# without waiting for a release.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Assemble the release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: network/gonet/go/go.mod
          cache-dependency-path: network/gonet/go/go.sum

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
          go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: true

      # The release key comes from repository secrets. It is decoded into the runner's temporary folder and never written
      # to the repository. Without the secrets the build stays unsigned.
      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::RELEASE_KEYSTORE_BASE64 is not set"; exit 1; }
          # Pasting from a phone can add line breaks or spaces, which base64 rejects.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Assemble the release APK
        env:
          POCKETPILOT_RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          POCKETPILOT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          POCKETPILOT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          POCKETPILOT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Remove the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload the release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pocketpilot-release
          path: app/build/outputs/apk/*/release/*.apk
          if-no-files-found: error
          retention-days: 14
