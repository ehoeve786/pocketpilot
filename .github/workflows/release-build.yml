name: Release build

# Builds the OSS release APK, with R8 shrinking and minification, and uploads it. Run it by hand to check the release
# build without waiting for a release. The app has no flavors; this is the oss distribution.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Assemble the release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the app's version is the commit count

      - uses: ./.github/actions/setup-build

      # The release key comes from repository secrets. It is decoded into the runner's temporary folder and never written
      # to the repository. Without the secrets this step fails, so an unsigned APK is never uploaded.
      - name: Decode the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::RELEASE_KEYSTORE_BASE64 is not set"; exit 1; }
          # Pasting from a phone can add line breaks or spaces, which base64 rejects.
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Assemble the release APK
        env:
          POCKETPILOT_RELEASE_STORE_FILE: ${{ runner.temp }}/release.jks
          POCKETPILOT_RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          POCKETPILOT_RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          POCKETPILOT_RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Remove the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks"

      - name: Upload the release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pocketpilot-release
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
