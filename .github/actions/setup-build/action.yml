name: Set up the build
description: Java, Go with gomobile, the pinned NDK and CMake, and Gradle with its cache, for every job that runs Gradle.

inputs:
  cache-read-only:
    description: Whether the Gradle cache is only read; main writes it.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
      with:
        distribution: temurin
        java-version: 21

    # network/gonet builds its Go networking library with gomobile and the runner's Android NDK.
    - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
      with:
        go-version-file: network/gonet/go/go.mod
        cache-dependency-path: network/gonet/go/go.sum

    - name: Install gomobile
      shell: bash
      run: |
        go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260908204917-8b95e45f8d3e
        go install golang.org/x/mobile/cmd/gobind@v0.0.0-20260908204917-8b95e45f8d3e
        echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"

    # capability/shizuku builds native code with the NDK and CMake pinned in libs.versions.toml; Gradle cannot
    # download SDK packages whose licences are not accepted, so they are installed here.
    - name: Install the pinned NDK and CMake
      shell: bash
      run: |
        ndk=$(sed -n 's/^ndk = "\(.*\)"/\1/p' gradle/libs.versions.toml)
        cmake=$(sed -n 's/^cmake = "\(.*\)"/\1/p' gradle/libs.versions.toml)
        sdkmanager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
        yes | "$sdkmanager" --licenses > /dev/null || true
        "$sdkmanager" --install "ndk;$ndk" "cmake;$cmake" > /dev/null

    - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
      with:
        cache-read-only: ${{ inputs.cache-read-only }}

    # A pull request is built at its merge commit, whose first parent is the base branch. Its version is the base's
    # commit count plus one, which is what main has after a squash merge, so the main build installs over this one.
    - name: Version a pull request's build as its merge will be
      if: github.event_name == 'pull_request'
      shell: bash
      run: echo "POCKETPILOT_VERSION_CODE=$(( $(git rev-list --count HEAD^1) + 1 ))" >> "$GITHUB_ENV"
